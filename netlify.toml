# Netlify site: befine (https://befine.info.vn)
# Deploy: npm run build -- befine && netlify deploy --prod --dir=dist/befine

[build]
  command = "npm run build -- befine"
  publish = "dist/befine"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
