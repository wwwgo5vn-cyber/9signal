# Netlify site: willbefine (https://willbefine.info.vn)
# Site ID: 83cb4d39-f685-4c8e-9d84-7bcacece8c97
# Deploy:
#   npm run build -- willbefine
#   netlify deploy --prod --dir=dist/willbefine --site=83cb4d39-f685-4c8e-9d84-7bcacece8c97 --config=netlify.willbefine.toml

[build]
  command = "npm run build -- willbefine"
  publish = "dist/willbefine"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
