# Mỗi project GitLab đặt biến SITE riêng (Settings > CI/CD > Variables)
# goodfeel: SITE=goodfeel | onemorestep: SITE=onemorestep

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

build-site:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - test -n "$SITE" || (echo "Chua dat bien SITE" && exit 1)
    - npm ci
    - npm run build -- $SITE
  artifacts:
    expire_in: 1 hour
    paths:
      - dist/$SITE/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

pages:
  stage: deploy
  image: alpine:latest
  needs:
    - build-site
  script:
    - mkdir -p public
    - cp -a dist/$SITE/. public/
    - touch public/.nojekyll
    - echo "$SITE.info.vn" > public/CNAME
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"