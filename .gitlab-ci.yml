# Deploy One More Step → GitLab Pages (custom domain: onemorestep.info.vn)
# Project: https://gitlab.com/capdiensaigon/onemorestep
# Custom domain: Deploy → Pages → Domains → onemorestep.info.vn
# DNS apex: A → 35.185.44.232 (+ AAAA → 2600:1901:0:7b8a::) or ALIAS → capdiensaigon.gitlab.io
# Verify TXT: _gitlab-pages-verification-code → gitlab-pages-verification-code=<code from Pages UI>

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

build-onemorestep:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm run build -- onemorestep
  artifacts:
    expire_in: 1 hour
    paths:
      - dist/onemorestep/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

pages:
  image: node:20
  script:
    - npm ci
    - node scripts/run-site.mjs build $SITE
    - rm -rf public
    - cp -r dist/$SITE public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
